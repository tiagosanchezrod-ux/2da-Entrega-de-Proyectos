services:
  postgres:
    image: postgres:16-alpine
    container_name: ecotrace_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - pgdata_ecotrace:/var/lib/postgresql/data

volumes:
  pgdata_ecotrace: